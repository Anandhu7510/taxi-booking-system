name: Java compile and booking regressions

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile application and regression tests
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out src/com/taxireservation/*.java tests/com/taxireservation/*.java
      - name: Test route distances and fares
        run: java -cp out com.taxireservation.RouteCatalogTest
      - name: Test driver selection and refresh rules
        run: java -cp out com.taxireservation.DriverAvailabilityTest
